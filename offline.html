<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>DPR Online - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-top: 4px solid #5bc0de;
      border-radius: 8px;
      padding: 2rem 1.5rem;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .icon { font-size: 3rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.4rem; margin: 0.5rem 0; }
    p { color: #666; margin: 0.5rem 0 1.25rem; line-height: 1.5; }
    button {
      background: #5bc0de;
      color: #fff;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #46b8da; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128246;</div>
    <h1>You're offline</h1>
    <p>DPR PWA can't reach the server right now. Reconnect to Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
